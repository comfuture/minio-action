name: Silo Action
description: Runs a Silo S3-compatible object storage server in a GitHub workflow
author: Changkyun Kim
branding:
  icon: upload-cloud
  color: blue
inputs:
  access_key:
    description: Access key ID for Silo server
    required: true
    default: minio
  secret_key:
    description: Secret access key for Silo server
    required: true
    default: miniotest
  port:
    description: Port number for Silo server
    required: false
    default: "9000"
  bucket_name:
    description: Create a bucket with the given name
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup Silo
      shell: bash
      env:
        MINIO_ROOT_USER: ${{ inputs.access_key }}
        MINIO_ROOT_PASSWORD: ${{ inputs.secret_key }}
        SILO_PORT: ${{ inputs.port }}
      run: |
        docker run -d \
          -p "${SILO_PORT}:9000" \
          --name silo \
          -e MINIO_ROOT_USER \
          -e MINIO_ROOT_PASSWORD \
          -v /tmp/silo-data:/data \
          docker.io/pgsty/silo:latest server /data

        for attempt in {1..30}; do
          if curl --fail --silent \
            "http://127.0.0.1:${SILO_PORT}/minio/health/ready" > /dev/null; then
            break
          fi

          if [[ "${attempt}" -eq 30 ]]; then
            docker logs silo
            exit 1
          fi

          sleep 1
        done

        {
          echo "AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}"
          echo "AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}"
          echo "AWS_EC2_METADATA_DISABLED=true"
        } >> "${GITHUB_ENV}"

    - name: Create bucket
      shell: bash
      if: ${{ inputs.bucket_name != '' }}
      env:
        SILO_BUCKET_NAME: ${{ inputs.bucket_name }}
        SILO_PORT: ${{ inputs.port }}
      run: |
        aws --endpoint-url "http://127.0.0.1:${SILO_PORT}/" \
          s3 mb "s3://${SILO_BUCKET_NAME}"
